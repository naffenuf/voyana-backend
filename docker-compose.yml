services:
  # PostgreSQL Database (for local development only)
  # Production uses AWS RDS or Supabase
  db:
    image: postgres:14-alpine
    container_name: voyana-db
    environment:
      POSTGRES_USER: voyana
      POSTGRES_PASSWORD: voyana_dev_pass
      POSTGRES_DB: voyana_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voyana"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for Celery broker and result backend)
  redis:
    image: redis:7-alpine
    container_name: voyana-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voyana-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://voyana:voyana_dev_pass@db:5432/voyana_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      # Mount source code for hot reload during development
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./tests:/app/tests
      - ./remote-config.json:/app/remote-config.json
      - ./celery_worker.py:/app/celery_worker.py
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: flask run --host=0.0.0.0 --port=5000 --reload

  # Celery Worker (for background tasks)
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voyana-celery-worker
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://voyana:voyana_dev_pass@db:5432/voyana_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      # Mount source code for hot reload during development
      - ./app:/app/app
      - ./celery_worker.py:/app/celery_worker.py
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A celery_worker.celery_app worker --loglevel=info --concurrency=2

volumes:
  postgres_data:
    driver: local
